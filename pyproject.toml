[project]
name = "tailorlock"
version = "0.1.0"
description = "Locked-template resume tailoring: the AI edits whitelisted fields only, a validator and renderer gate every change."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typst>=0.13",
    "pypdf>=5.0",
    "mcp>=1.2",
    "anthropic>=0.40",
]

[project.scripts]
tailorlock = "tailorlock.cli:main"
tailorlock-mcp = "tailorlock.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tailorlock"]
